<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audiobook Reader</title>
<style>
  :root {
    --bg: #f7f5f0; --panel: #ffffff; --text: #22201c; --muted: #6b665d;
    --accent: #3b5bdb; --line: #e3dfd6; --current: #fff3bf; --done: #a8a399;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #212126; --text: #ecebe8; --muted: #9a978f;
      --accent: #7c93ff; --line: #33333a; --current: #3d3720; --done: #6c6a64;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 140px; }
  h1 { font-size: 1.4rem; margin: 0 0 16px; }
  textarea { width: 100%; min-height: 320px; padding: 14px; border: 1px solid var(--line);
             border-radius: 10px; background: var(--panel); color: var(--text);
             font: 17px/1.6 Georgia, serif; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }
  select, button { font: inherit; padding: 8px 12px; border-radius: 8px;
                   border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .meta { color: var(--muted); font-size: .9rem; }
  #reader { display: none; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 18px 22px; font: 18px/1.75 Georgia, serif; }
  #reader p { margin: 0 0 .9em; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  #reader p.done { color: var(--done); }
  #reader p.current { background: var(--current); }
  #reader p.loading::after { content: " ⏳"; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel);
         border-top: 1px solid var(--line); padding: 10px 16px; display: none; }
  #bar .inner { max-width: 820px; margin: 0 auto; }
  progress { width: 100%; height: 6px; }
  #error { color: #d9480f; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Audiobook Reader</h1>

  <div id="setup">
    <textarea id="input" placeholder="Paste a chapter, an article, a whole book..."></textarea>
    <div class="row">
      <label>Voice <select id="voice"><option>Loading...</option></select></label>
      <label>Model
        <select id="model">
          <option value="eleven_multilingual_v2">Multilingual v2 (best quality)</option>
          <option value="eleven_flash_v2_5">Flash v2.5 (faster, half the credits)</option>
        </select>
      </label>
      <button class="primary" id="start">Start reading</button>
      <span class="meta" id="count"></span>
    </div>
  </div>

  <div id="reader"></div>
  <div class="row"><button id="edit" style="display:none">Edit text</button></div>
  <p id="error"></p>
</main>

<div id="bar"><div class="inner">
  <div class="row" style="margin:0 0 6px">
    <button id="prev" title="Previous passage">⏮</button>
    <button class="primary" id="play">⏸</button>
    <button id="next" title="Next passage">⏭</button>
    <label>Speed
      <select id="speed">
        <option>0.75</option><option>0.9</option><option selected>1</option>
        <option>1.1</option><option>1.25</option><option>1.5</option><option>2</option>
      </select>
    </label>
    <button id="download" disabled>Download MP3</button>
    <span class="meta" id="status"></span>
  </div>
  <progress id="progress" value="0" max="1"></progress>
</div></div>

<audio id="audio"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $("audio");
const CHUNK_TARGET = 1000;   // characters per request; keeps each call well under the function timeout
const PREFETCH = 2;          // passages generated ahead of the one playing

let chunks = [];             // [{text, el, blob, url, promise}]
let current = 0;
let playing = false;

// ---------- voices ----------
fetch("/api/voices").then(r => r.json()).then(list => {
  if (list.error) throw new Error(list.error);
  const sel = $("voice");
  sel.innerHTML = "";
  for (const v of list) sel.add(new Option(`${v.name} (${v.category})`, v.id));
  const saved = localStorageGet("voice");
  if (saved && list.some(v => v.id === saved)) sel.value = saved;
}).catch(e => showError("Could not load voices: " + e.message));

$("input").addEventListener("input", () => {
  const n = $("input").value.length;
  $("count").textContent = n ? `${n.toLocaleString()} characters` : "";
});

// ---------- chunking ----------
// Split on paragraphs, then pack sentences so no request exceeds CHUNK_TARGET.
function makeChunks(text) {
  const out = [];
  const paras = text.replace(/\r/g, "").split(/\n\s*\n+/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean);
  for (const para of paras) {
    if (para.length <= CHUNK_TARGET) { out.push(para); continue; }
    const sentences = para.match(/[^.!?…]+[.!?…]+["”’)\]]*\s*|[^.!?…]+$/g) || [para];
    let buf = "";
    for (let s of sentences) {
      // A single runaway sentence still has to fit; break it on spaces.
      while (s.length > CHUNK_TARGET) {
        const cut = s.lastIndexOf(" ", CHUNK_TARGET) > 0 ? s.lastIndexOf(" ", CHUNK_TARGET) : CHUNK_TARGET;
        if (buf) { out.push(buf.trim()); buf = ""; }
        out.push(s.slice(0, cut).trim());
        s = s.slice(cut);
      }
      if ((buf + s).length > CHUNK_TARGET && buf) { out.push(buf.trim()); buf = ""; }
      buf += s;
    }
    if (buf.trim()) out.push(buf.trim());
  }
  return out;
}

// ---------- generation ----------
function load(i) {
  const c = chunks[i];
  if (!c) return Promise.resolve(null);
  if (c.promise) return c.promise;
  c.el.classList.add("loading");
  c.promise = fetch("/api/speak", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text: c.text,
      voice_id: $("voice").value,
      model_id: $("model").value,
      previous_text: chunks[i - 1]?.text.slice(-500) || "",
      next_text: chunks[i + 1]?.text.slice(0, 500) || "",
    }),
  }).then(async r => {
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
    c.blob = await r.blob();
    c.url = URL.createObjectURL(c.blob);
    c.el.classList.remove("loading");
    updateStatus();
    return c;
  }).catch(e => {
    c.promise = null;
    c.el.classList.remove("loading");
    throw e;
  });
  return c.promise;
}

async function playFrom(i) {
  if (i < 0 || i >= chunks.length) { finish(); return; }
  current = i;
  chunks.forEach((c, k) => {
    c.el.classList.toggle("current", k === i);
    c.el.classList.toggle("done", k < i);
  });
  chunks[i].el.scrollIntoView({ behavior: "smooth", block: "center" });
  updateStatus();
  try {
    const c = await load(i);
    for (let k = 1; k <= PREFETCH; k++) load(i + k).catch(() => {});
    if (current !== i) return;          // user skipped while this was loading
    audio.src = c.url;
    audio.playbackRate = Number($("speed").value);
    if (playing) await audio.play();
  } catch (e) {
    showError(e.message);
    setPlaying(false);
  }
}

audio.addEventListener("ended", () => playFrom(current + 1));
audio.addEventListener("timeupdate", updateProgress);

function finish() {
  setPlaying(false);
  chunks.forEach(c => { c.el.classList.remove("current"); c.el.classList.add("done"); });
  current = chunks.length;
  updateStatus();
}

// ---------- controls ----------
$("start").onclick = () => {
  const text = $("input").value.trim();
  if (!text) return;
  showError("");
  localStorageSet("voice", $("voice").value);
  chunks.forEach(c => c.url && URL.revokeObjectURL(c.url));
  const reader = $("reader");
  reader.innerHTML = "";
  chunks = makeChunks(text).map((t, i) => {
    const el = document.createElement("p");
    el.textContent = t;
    el.onclick = () => { setPlaying(true); playFrom(i); };
    reader.appendChild(el);
    return { text: t, el };
  });
  $("setup").style.display = "none";
  reader.style.display = "block";
  $("edit").style.display = "inline-block";
  $("bar").style.display = "block";
  setPlaying(true);
  playFrom(0);
};

$("edit").onclick = () => {
  audio.pause(); setPlaying(false);
  $("setup").style.display = "block";
  $("reader").style.display = "none";
  $("edit").style.display = "none";
  $("bar").style.display = "none";
};

$("play").onclick = () => {
  if (current >= chunks.length) { setPlaying(true); playFrom(0); return; }
  setPlaying(!playing);
  if (playing) audio.src ? audio.play() : playFrom(current); else audio.pause();
};
$("prev").onclick = () => playFrom(Math.max(0, audio.currentTime > 3 ? current : current - 1));
$("next").onclick = () => playFrom(current + 1);
$("speed").onchange = () => { audio.playbackRate = Number($("speed").value); };

// MP3 frames concatenate cleanly, so the full book is just the blobs joined.
$("download").onclick = async () => {
  $("download").disabled = true;
  try {
    for (let i = 0; i < chunks.length; i++) {
      $("status").textContent = `Preparing download: ${i + 1} / ${chunks.length}`;
      await load(i);
    }
    const blob = new Blob(chunks.map(c => c.blob), { type: "audio/mpeg" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "audiobook.mp3";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  } catch (e) {
    showError(e.message);
  }
  updateStatus();
};

document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || $("bar").style.display !== "block") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.code === "ArrowRight") $("next").click();
  if (e.code === "ArrowLeft") $("prev").click();
});

// ---------- helpers ----------
function setPlaying(p) { playing = p; $("play").textContent = p ? "⏸" : "▶"; }

function updateStatus() {
  const ready = chunks.filter(c => c.blob).length;
  const shown = Math.min(current + 1, chunks.length);
  $("status").textContent = `Passage ${shown} / ${chunks.length} · ${ready} generated`;
  $("download").disabled = !chunks.length;
  updateProgress();
}

function updateProgress() {
  if (!chunks.length) return;
  const frac = audio.duration ? audio.currentTime / audio.duration : 0;
  $("progress").value = (Math.min(current, chunks.length) + (current < chunks.length ? frac : 0)) / chunks.length;
}

function showError(msg) { $("error").textContent = msg; }
function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
</script>
</body>
</html>
